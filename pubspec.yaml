name: viewdex
description: "Viewdex — one app for opening and managing many common file types."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Logging
  logging: ^1.3.0

  # File System
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  mime: ^2.0.0
  path: ^1.9.1
  share_plus: ^10.1.4
  open_filex: ^4.5.0
  intl: ^0.19.0

  # Image Viewer
  photo_view: ^0.15.0

  # Video & Audio Player
  video_player: ^2.9.2

  # PDF Viewer
  pdfrx: ^1.0.89

  # Archive Engine
  archive: ^3.6.1

  # Text/Code Viewer
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # Local Storage
  shared_preferences: ^2.3.4

  # Material Design Icons (included with Flutter)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
