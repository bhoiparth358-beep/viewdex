name: Build Viewdex APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual build trigger from GitHub website anytime

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code (Analyze)
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split ABI APKs (arm64-v8a, armeabi-v7a, x86_64)
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal APK (Recommended for all phones)
        uses: actions/upload-artifact@v4
        with:
          name: Viewdex-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Split APKs (Optimized size)
        uses: actions/upload-artifact@v4
        with:
          name: Viewdex-Split-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
